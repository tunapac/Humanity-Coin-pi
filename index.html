<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanity Ledger & humaInvidio AI Hub</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body {
            background-color: #120c1f;
            color: #f3e8ff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #1e1435;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #d97706; } /* Dark Amber */
        h2 { color: #8b5cf6; } /* Royal Gold/Purple */
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .blue-btn { background-color: #2563eb; color: white; }
        .purple-btn { background-color: #7c3aed; color: white; }
        button:hover { opacity: 0.9; }
        #statusLog {
            background: #0f0822;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            color: #10b981;
            text-align: left;
            margin-top: 20px;
            height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>HUMANITY LEDGER HUB</h1>
    <h2>humaInvidio AI Production</h2>
    <p>Status: <span id="connectionState" style="color:#ef4444;">Disconnected</span></p>

    <button class="blue-btn" id="authBtn">Authenticate with Pi</button>
    <button class="purple-btn" id="testTxBtn">Trigger Step 10 Test Transaction</button>

    <div id="statusLog">Console ready...</div>
</div>

<script>
    const logDiv = document.getElementById('statusLog');
    function log(msg) {
        logDiv.innerHTML += "<br/>> " + msg;
        logDiv.scrollTop = logDiv.scrollHeight;
        console.log(msg);
    }

    // Initialize Pi SDK instantly
    try {
        window.Pi.init({ version: "2.0", sandbox: true });
        document.getElementById('connectionState').innerText = "Connected to Sandbox";
        document.getElementById('connectionState').style.color = "#10b981";
        log("🚀 Pi SDK Initialized Successfully.");
    } catch(e) {
        log("❌ SDK Init Error: Access inside Pi Browser.");
    }

    // Fix for Button 1: Authenticate with Pi
    document.getElementById('authBtn').addEventListener('click', async () => {
        log("🔒 Requesting sandbox user authentication...");
        try {
            const scopes = ['username', 'payments', 'wallet_address'];
            const auth = await window.Pi.authenticate(scopes, onIncompletePaymentFound);
            log(`✅ Authenticated! Welcome ${auth.user.username}`);
            alert(`Connected as: ${auth.user.username}`);
        } catch (err) {
            log(`❌ Auth stalled: ${err.message || err}`);
        }
    });

    // Fix for Button 2: Step 10 Checklist Validation
    document.getElementById('testTxBtn').addEventListener('click', async () => {
        log("💸 Spinning up Step 10 Developer Checklist Payment...");
        try {
            const payment = await window.Pi.createPayment({
                amount: 0.1,
                memo: "humaInvidio AI Engine & HUMT Token Unified Verification",
                metadata: { project: "humaInvidio-HUMT-Joint" }
            }, {
                onReadyForServerApproval: (paymentId) => {
                    log(`📥 Payment created! ID: ${paymentId}. Sending to Node backend...`);
                    // Sends automatically to your port 3000 backend
                    fetch('/api/approve-payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId })
                    }).then(() => log("🔄 Backend approved transaction. awaiting signing..."));
                },
                onReadyForServerCompletion: (paymentId, txid) => {
                    log(`📦 Tx Signed on Chain! TXID: ${txid}. Finalizing...`);
                    fetch('/api/complete-payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId, txid })
                    }).then(() => log("🎯 Verification Complete!"));
                },
                onCancel: (paymentId) => log(`⚠️ Payment canceled for ID: ${paymentId}`),
                onError: (error, payment) => log(`❌ Payment Error: ${error.message}`)
            });
        } catch (err) {
            log(`❌ Transaction Setup Failed: ${err.message}`);
        }
    });

    function onIncompletePaymentFound(payment) {
        log(`🔍 Found unresolved payment hanging: ${payment.identifier}`);
    }
</script>

</body>
</html>
