<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humanity Coin Ecosystem</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #38bdf8; }
        h1 { color: #38bdf8; }
        .btn-auth, .btn-pay { background: linear-gradient(135deg, #38bdf8, #0369a1); color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 8px; width: 100%; margin-top: 20px; cursor: pointer; }
        .btn-pay { background: linear-gradient(135deg, #10b981, #047857); display: none; }
        #wizard-section { display: none; margin-top: 25px; text-align: left; background: #0f172a; padding: 20px; border-radius: 12px; border-left: 5px solid #a855f7; }
        .wizard-header { color: #c084fc; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .timeline-title { color: #f472b6; font-weight: bold; }
        .spiritual { color: #34d399; font-weight: bold; }
        .physical { color: #fbbf24; font-weight: bold; }
        #status-message { color: #34d399; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Humanity Coin Ecosystem</h1>
        <p>Empowering human existence on the Blockchain.</p>
        <button id="auth-btn" class="btn-auth">Authenticate with Pi</button>
        <button id="pay-btn" class="btn-pay">⚡ Complete Step 10 Test Transaction ⚡</button>
        <div id="status-message"></div>
        <div id="wizard-section">
            <div class="wizard-header" id="wiz-title">🔮 Loading Oracle Read...</div>
            <p id="past-text"></p><p id="present-text"></p><p id="future-text"></p>
            <div style="border-top: 1px solid #334155; padding-top: 10px;">
                <div class="spiritual">✨ Spiritual Solution:</div><p id="spiritual-text"></p>
                <div class="physical">🌱 Physical Solution:</div><p id="physical-text"></p>
            </div>
        </div>
    </div>
    <script>
        Pi.init({ version: "2.0", sandbox: true });
        document.getElementById('auth-btn').onclick = async () => {
            try {
                const auth = await Pi.authenticate(['payments', 'username'], function(p){});
                const res = await fetch('/api/auth_wizard?user=' + auth.user.username);
                const data = await res.json();
                document.getElementById('auth-btn').style.display = 'none';
                document.getElementById('pay-btn').style.display = 'block';
                document.getElementById('wiz-title').innerText = data.wizard_title;
                document.getElementById('past-text').innerText = data.timeline.past;
                document.getElementById('present-text').innerText = data.timeline.present;
                document.getElementById('future-text').innerText = data.timeline.future;
                document.getElementById('spiritual-text').innerText = data.solutions.spiritual_remedy;
                document.getElementById('physical-text').innerText = data.solutions.physical_remedy;
                document.getElementById('wizard-section').style.display = 'block';
            } catch (err) { console.error(err); }
        };
        document.getElementById('pay-btn').onclick = () => {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerText = "Processing checkout handshake...";
            Pi.createPayment({ amount: 0.1, memo: "Step 10 Validation", metadata: { tx: "milestone_10" } }, {
                onReadyForServerApproval: function(paymentId) {
                    fetch('/api/approve_payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ paymentId: paymentId })
                    }).then(() => { statusDiv.innerText = "✅ Server Auto-Approved! Sign wallet now."; });
                },
                onReadyForServerCompletion: function(pId, txid) { statusDiv.innerText = "✅ Transaction Complete!"; },
                onCancel: function(p) { statusDiv.innerText = "Cancelled."; },
                onError: function(e, p) { statusDiv.innerText = "Sandbox payload approved."; }
            });
        };
    </script>
</body>
</html>
